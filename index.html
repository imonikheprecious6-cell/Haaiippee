<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = origFetch ? function() { return origFetch.apply(window, arguments); } : undefined;
          
          var descriptor = {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch(e) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch(e) {}
          }
        } catch(err) {
          console.warn('Fetch polyfill setup error:', err);
        }
      })();
    </script>
    <title>Precious Imonikhe - Senior Web Designer & SEO Specialist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
